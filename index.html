<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Overlay Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 960px;
      margin: auto;
    }
    .card-glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      padding: 2rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
    }
    canvas {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .image-container {
      margin-bottom: 2rem;
    }
    .form-label {
      margin-top: 1rem;
    }
    .btn-primary {
      margin-top: 2rem;
      font-size: 1.2rem;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    #loader {
      display: none;
      text-align: center;
      margin: 1rem;
    }
    #loader i {
      font-size: 2rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-glass">
      <h1 class="text-center mb-4">🎨 Gradient Overlay Tool</h1>
      <div class="mb-3">
        <label for="upload" class="form-label"><i class="fa-solid fa-upload"></i> PNG画像を選択（複数可）</label>
        <input class="form-control" type="file" id="upload" accept="image/png" multiple>
      </div>

      <div class="row">
        <div class="col-md-6">
          <label for="startColor" class="form-label"><i class="fa-solid fa-fill-drip"></i> 開始色</label>
          <input type="color" id="startColor" class="form-control form-control-color" value="#ff0000">
        </div>
        <div class="col-md-6">
          <label for="endColor" class="form-label"><i class="fa-solid fa-fill-drip"></i> 終了色</label>
          <input type="color" id="endColor" class="form-control form-control-color" value="#0000ff">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label for="opacity" class="form-label"><i class="fa-solid fa-adjust"></i> 不透明度（0〜100）</label>
          <input type="range" class="form-range" id="opacity" min="0" max="100" value="80">
        </div>
        <div class="col-md-6">
          <label for="direction" class="form-label"><i class="fa-solid fa-arrows-alt-h"></i> グラデーション方向</label>
          <select id="direction" class="form-select">
            <option value="vertical">縦</option>
            <option value="horizontal">横</option>
            <option value="diagonal1">斜め ↘</option>
            <option value="diagonal2">斜め ↙</option>
          </select>
        </div>
      </div>

      <div class="text-center">
        <button onclick="processImages()" class="btn btn-primary btn-lg"><i class="fa-solid fa-magic"></i> 画像を処理してZIPで保存</button>
        <div id="loader"><i class="fas fa-spinner"></i> 処理中…</div>
      </div>
    </div>

    <div id="preview"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
  <script>
    async function processImages() {
      const files = document.getElementById('upload').files;
      const startColor = document.getElementById('startColor').value;
      const endColor = document.getElementById('endColor').value;
      const direction = document.getElementById('direction').value;
      const opacity = parseInt(document.getElementById('opacity').value) / 100;
      const preview = document.getElementById('preview');
      const loader = document.getElementById('loader');

      preview.innerHTML = '';
      loader.style.display = 'block';

      const zip = new JSZip();

      for (const file of files) {
        const img = await loadImage(file);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        let grad;
        switch (direction) {
          case 'horizontal':
            grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            break;
          case 'diagonal1':
            grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            break;
          case 'diagonal2':
            grad = ctx.createLinearGradient(canvas.width, 0, 0, canvas.height);
            break;
          default:
            grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        }

        grad.addColorStop(0, hexToRgba(startColor, opacity));
        grad.addColorStop(1, hexToRgba(endColor, opacity));

        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'source-over';

        const dataUrl = canvas.toDataURL('image/png');
        const imgData = await (await fetch(dataUrl)).blob();

        const newFileName = file.name.replace(/(\d+x\d+)/, 'grad');
        zip.file(newFileName, imgData);

        const container = document.createElement('div');
        container.className = 'image-container card-glass';
        container.appendChild(canvas);
        preview.appendChild(container);
      }

      zip.generateAsync({ type: "blob" }).then(function(content) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = 'processed_images.zip';
        link.click();
        loader.style.display = 'none';
      });
    }

    function loadImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
  </script>
</body>
</html>
